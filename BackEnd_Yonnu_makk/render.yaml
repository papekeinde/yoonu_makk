services:
  - type: web
    name: yoonu-makk-backend
    env: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader; npm install; npm run build
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql # Ou sqlite si vous testez rapidement
